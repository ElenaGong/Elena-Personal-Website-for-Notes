site_name: My Study Notes
site_url: https://ElenaGong.github.io/Elena-Personal-Website-for-Notes
site_description: 本科学习笔记
site_author: Your Name

repo_name: ElenaGong/Elena-Personal-Website-for-Notes
repo_url: https://github.com/ElenaGong/Elena-Personal-Website-for-Notes.git

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
  - tags

markdown_extensions:
  # 数学公式
  - pymdownx.arithmatex:
      generic: true
  # 代码高亮
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  # 提示/警告框
  - admonition
  - pymdownx.details
  # 表格、列表等
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  # 脚注
  - footnotes
  # 目录
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ElenaGong

nav:
  - 首页: index.md
  - 数学:
      - 概述: math/index.md
      - 信息论: math/InfoTheory/index.md
      - 数值分析: math/NumericalAnalysis/index.md
  - 计算机科学:
      - 概述: cs/index.md
      - 编译原理: cs/CompilerPrinciples/index.md
      - 软件基础: cs/SoftwareFoundations/index.md
  - 人工智能:
      - 概述: ai/index.md
  - 关于: about.md
