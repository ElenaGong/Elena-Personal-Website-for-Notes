site_name: My Study Notes
site_url: https://ElenaGong.github.io/Elena-Personal-Website-for-Notes
site_description: 本科学习笔记
site_author: Elena

repo_name: ElenaGong/Elena-Personal-Website-for-Notes
repo_url: https://github.com/ElenaGong/Elena-Personal-Website-for-Notes.git

theme:
  name: material
  language: zh
  static_templates:
    - 404.html
  favicon: images/favicon.ico
  apple-touch-icon-precomposed: images/mobile_icon.png
  include_search_page: false
  search_index_only: true

  features:
    - header.autohide
    - navigation.tracking
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - content.code.annotate

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: light blue
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  font:
    text: Roboto Slab
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - zh
        - en
  - tags

markdown_extensions:
  # 数学公式
  - pymdownx.arithmatex:
      generic: true
  # 代码高亮
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  # 提示/警告框
  - admonition
  - pymdownx.details
  # 表格、列表等
  - tables
  - pymdownx.tasklist:
      custom_checkbox: true
  # 脚注
  - footnotes
  # 目录
  - toc:
      permalink: true
      toc_depth: 3

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://ElenaGong.github.io/Elena-Personal-Website-for-Notes/

# 新增 .md 文件不会自动出现在导航栏，必须同步在 mkdocs.yml 的 nav: 里登记
nav:
  - 首页: index.md
  - 信息论: math/InfoTheory/index.md
  - 编译原理:
    - 概述: cs/CompilerPrinciples/index.md
    - 第一章 课程概览: cs/CompilerPrinciples/01-Overview.md
    - 第二章 词法分析: cs/CompilerPrinciples/02-LexicalAnalysis.md
  - 软件科学基础: cs/SoftwareFoundations/index.md
  - 关于: about.md
